services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    container_name: autobrr
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    user: 1000:1000
    volumes:
      - ./autobrr/data/config:/config
    networks:
      - seedbox
    ports:
      - 7474:7474

  qbittorrent:
    build:
      context: ./qbittorrent
      args:
        NET_ENV: ${NET_ENV:-global}
    image: qbittorrent
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./rclone_115/rclone:/usr/bin/rclone
      - ~/.config/rclone/:/root/.config/rclone/
      - ./qbittorrent/bin/upload.sh:/usr/bin/upload.sh
      - ./qbittorrent/data/config:/config
      - ./qbittorrent/data/downloads:/downloads
    networks:
      - seedbox
    ports:
      - 8080:8080

networks:
  seedbox:
